<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết phim</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="./index.html">Mind<span class="text-danger">X</span> Cinema</a>
    <div>
      <a href="./search.html" class="btn btn-outline-light me-2">Tìm kiếm</a>
      <div id="avatar-action-container" class="d-inline"></div>
    </div>
  </nav>

  <!-- Nội dung chính -->
  <main class="container my-5 pt-5">
    <div id="movie-detail" class="row"></div>
    <section class="mt-5">
      <h3>Bình luận</h3>
      <form id="comment-form" class="d-flex mb-3">
        <input id="comment" type="text" class="form-control me-2" placeholder="Viết bình luận..." />
        <button type="submit" class="btn btn-danger">Gửi</button>
      </form>
      <ul id="comment-list" class="list-group"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./scripts/movie.js"></script>
  <script type="module" src="./scripts/auth.js"></script>
</body>
</html>
