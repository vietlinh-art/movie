<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindX Cinema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="./styles/main.css" />
</head>

<body class="bg-dark text-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="./index.html">Mind<span class="text-danger">X</span> Cinema</a>
    <div>
      <a href="./search.html" class="btn btn-outline-light me-2">Tìm kiếm</a>
      <div id="avatar-action-container" class="d-inline"></div>
    </div>
  </nav>

  <!-- Hero Carousel Section -->
  <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner" id="hero-slides"></div>

    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <!-- Movie Sections -->
  <main class="container my-5">
    <div id="movie-list" class="row g-4"></div>
    <div id="ai-suggestions" class="mt-5"></div>
  </main>

  <footer class="text-center py-3 border-top border-secondary">
    <p>&copy; MindX School</p>
  </footer>

  <script type="module" src="./scripts/auth.js"></script>
  <script type="module" src="./scripts/home.js"></script>
</body>

</html>
